{% set version = "0.9.11" %}

package:
  name: hyperion-fortran
  version: {{ version }}

source:
  fn: Hyperion-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/h/hyperion/hyperion-{{ version }}.tar.gz
  md5: bcbacd463810b9787eb99a2d82cc7224
  patches:
    # the h5fc wrapper in HDF5 2 ignores HDF5_FC, which was used to build the MPI binaries
    - 0001-mpi-compiler-with-hdf5-2-h5fc.patch

build:
  number: 6
  skip: True  # [win]

requirements:
  build:
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - make
    # the h5fc wrapper in HDF5 2 calls pkg-config to find the HDF5 flags
    - pkgconf
  host:
    - hdf5
    - zlib
    - mpich
  run:
    - hdf5
    - zlib
    - mpich

test:
  files:
    - amr.rtin
    - car.rtin
    - cyl.rtin
    - oct.rtin
    - sph.rtin
    - vor.rtin

about:
  home: https://github.com/hyperion-rt/hyperion
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Hyperion Radiation Transfer Code

extra:
  recipe-maintainers:
    - astrofrog
